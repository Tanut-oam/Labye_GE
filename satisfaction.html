<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>แบบประเมินความพึงพอใจ — ล้าบาย</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/auth.css">
</head>
<body data-page="satisfaction">
<main class="auth-wrap">
  <div class="auth-card wide">
    <h1 style="margin:0 0 18px;font-size:18px;font-weight:600">แบบประเมินความพึงพอใจในการใช้เว็บไซต์</h1>

    <div class="progress"><span id="bar"></span></div>

    <p class="q-no" id="q-no"></p>
    <p class="q-text" id="q-text"></p>

    <div class="scale" id="scale"></div>
    <div class="scale-ends"><span>น้อยที่สุด</span><span>มากที่สุด</span></div>

    <p class="msg" id="msg" role="status"></p>

    <div class="quiz-nav">
      <button class="btn-sm" id="back">ย้อนกลับ</button>
      <button class="btn-sm primary" id="next">ต่อไป</button>
    </div>
  </div>
</main>
<script type="module" src="assets/js/satisfaction.js"></script>
</body>
</html>
