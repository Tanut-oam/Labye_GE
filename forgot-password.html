<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ตั้งรหัสผ่านใหม่ — ล้าบาย</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/auth.css">
</head>
<body data-page="forgot">
<main class="auth-wrap">
  <form class="auth-card" id="forgot-form">
    <div class="brand"><span class="brand-mark">☺</span><span class="brand-name">ตั้งรหัสผ่านใหม่</span></div>

    <p style="font-size:13px;color:var(--ink-soft);margin:0 0 18px">
      กรอกอีเมลที่ใช้สมัคร ระบบจะส่งลิงก์สำหรับตั้งรหัสผ่านใหม่ไปให้
    </p>

    <div class="field">
      <label for="email">อีเมล</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
    </div>

    <p class="msg" id="msg" role="status"></p>

    <button class="btn-main" id="submit" type="submit">ส่งลิงก์ตั้งรหัสผ่าน</button>
    <a class="btn-ghost" href="index.html" style="display:flex;align-items:center;justify-content:center;text-decoration:none">ยกเลิก</a>
  </form>
</main>
<script type="module" src="assets/js/auth.js"></script>
</body>
</html>
