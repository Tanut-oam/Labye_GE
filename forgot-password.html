<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ตั้งรหัสผ่านใหม่ — ล้าบาย</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/auth.css">
</head>
<body data-page="forgot">
<main class="auth-wrap">
  <form class="auth-card" id="forgot-form" novalidate>
    <div class="brand"><span class="brand-mark">☺</span><span class="brand-name">ตั้งรหัสผ่านใหม่</span></div>

    <!-- ขั้นที่ 1 ขอลิงก์ตั้งรหัสผ่าน -->
    <section data-forgot-step="request">
      <p style="font-size:13px;color:var(--ink-soft);margin:0 0 18px">
        กรอกอีเมลที่ใช้สมัคร ระบบจะส่งลิงก์สำหรับตั้งรหัสผ่านใหม่ไปให้ กดลิงก์ครั้งเดียวแล้วตั้งรหัสใหม่ได้ในหน้าเดียว
      </p>
      <div class="field">
        <label for="email">อีเมล</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
        <p class="field-error" id="email-error"></p>
      </div>
      <button class="btn-main" id="submit" type="submit">ส่งลิงก์ตั้งรหัสผ่าน</button>
      <a class="btn-ghost" href="index.html" style="display:flex;align-items:center;justify-content:center;text-decoration:none">ยกเลิก</a>
    </section>

    <!-- ขั้นที่ 2 ตั้งรหัสผ่านใหม่ (แสดงเมื่อมาจากลิงก์ในอีเมล) -->
    <section data-forgot-step="set" hidden>
      <p style="font-size:13px;color:var(--ink-soft);margin:0 0 18px">
        ตั้งรหัสผ่านใหม่ของคุณ อย่างน้อย 8 ตัวอักษร
      </p>
      <div class="field">
        <label for="new-password">รหัสผ่านใหม่</label>
        <input id="new-password" name="new-password" type="password" autocomplete="new-password" minlength="8" required>
        <p class="field-help">อย่างน้อย 8 ตัวอักษร</p>
        <p class="field-error" id="new-password-error"></p>
      </div>
      <div class="field">
        <label for="new-password2">ยืนยันรหัสผ่านใหม่</label>
        <input id="new-password2" name="new-password-confirmation" type="password" autocomplete="new-password" required>
        <p class="field-error" id="new-password2-error"></p>
      </div>
      <button class="btn-main" id="set-submit" type="submit">บันทึกรหัสผ่านใหม่</button>
    </section>

    <p class="msg" id="msg" role="status" aria-live="polite"></p>
  </form>
</main>
<script type="module" src="assets/js/auth.js"></script>
</body>
</html>
